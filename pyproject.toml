[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-manager"
version = "1.5.1"
description = "GitHub Repository Manager CLI - kelola Git & GitHub lewat menu interaktif di Termux/Linux tanpa perlu hafal perintah Git."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "catur003" },
]
keywords = ["git", "github", "cli", "termux", "git-manager"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "colorama>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/catur003/github-manager"
Issues = "https://github.com/catur003/github-manager/issues"
Changelog = "https://github.com/catur003/github-manager/blob/main/CHANGELOG.md"

# Ini yang bikin command 'github-manager' muncul otomatis di PATH setelah
# `pip install github-manager` - pip/setuptools generate script kecil di
# folder bin/Scripts venv yang manggil modules.cli:main() langsung, LEWAT
# IMPORT PYTHON (bukan lewat subprocess/shell), dan shebang-nya otomatis
# dirapikan pip supaya nunjuk ke python venv yang benar. Ini mekanisme
# resmi pip buat CLI command - beda total dari 'postinstall hook' ala npm
# yang cuma jalanin script arbitrary setelah install (dan itu pun cuma
# jalan kalau install dari sdist, BUKAN dari wheel yang biasanya dipakai
# pip install dari PyPI).
[project.scripts]
github-manager = "modules.cli:main"

[tool.setuptools]
packages = ["modules"]
